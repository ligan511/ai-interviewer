global:
  scrape_interval: 15s
  evaluation_interval: 30s

# 告警规则（Prometheus 自动发现 ./alerts.yml）
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - []

scrape_configs:
  # 抓取后端 AI 调用指标（P50/P95/P99 + 成功率 + 熔断器状态）
  - job_name: ai-interviewer-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          # 容器内 Prometheus 通过 ai-net 访问 backend；本地开发改 172.17.0.1:8081
          - target: backend:8081
            labels:
              instance: ai-interviewer
  # 抓取自身
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

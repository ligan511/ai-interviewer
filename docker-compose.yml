# AI 智能面试官与求职能力评估系统 - 一键部署
# 使用：docker compose up -d
# 包含：MySQL 8 + Backend (Spring Boot) + AI Service (FastAPI) + Frontend (Nginx)
# 依赖镜像：mysql:8.0、maven:3.9-eclipse-temurin-17、python:3.11-slim、node:20-alpine、nginx:alpine

services:
  mysql:
    image: mysql:8.0
    container_name: ai-interviewer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_DATABASE: ai_interviewer
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./AI智能面试官系统_MySQL_V1.0.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai-net

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: ai-interviewer-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/ai_interviewer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      AI_SERVICE_BASE_URL: http://ai-service:8001
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?AI_INTERNAL_KEY must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      LOG_PATH: /var/log/ai-interviewer
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads
      - backend_logs:/var/log/ai-interviewer
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/v1/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - ai-net

  ai-service:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
    container_name: ai-interviewer-ai-service
    restart: unless-stopped
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?AI_INTERNAL_KEY must be set}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DASHSCOPE_KEY: ${DASHSCOPE_KEY:-}
      VECTOR_DB_PATH: /app/data/knowledge.db
    ports:
      - "8001:8001"
    volumes:
      - vector_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai-net

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: ai-interviewer-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ai-service
    ports:
      - "80:80"
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
  vector_data:
  backend_logs:
